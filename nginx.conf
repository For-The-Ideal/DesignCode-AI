# DesignCode-AI Nginx Site Configuration
# 反向代理：前端 Nuxt (3000) + 后端 API (8888)

server {
    listen 80;
    server_name 111.229.28.247;

    # 前端静态资源 & 页面
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Nuxt SSR API 代理（ajaxData 路由需要 Nuxt 处理解密和转发）
    location = /api/ajaxData {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Nuxt SSE 代理（任务进度 / 代码流式推送）
    # 前端请求的是 Nuxt 自己的 /api/sse/:taskId 与 /api/sse/user，
    # 必须先由 Nuxt 处理再透传给 Go 的 /api/v1/sse/*，不能直连 Go（会 404）
    location /api/sse/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8888/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 日志
    access_log /www/wwwlogs/designcode-ai.access.log;
    error_log /www/wwwlogs/designcode-ai.error.log;
}
