# air 热重载配置（在 cmd/server 目录直接运行 air）
#
# root 指向 frontend_api 根目录：构建与运行进程的工作目录与生产 systemd 一致，
# config.dev.yaml / prompts/ / logs/ 都按项目根解析。
root = ".."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main.exe ./cmd/server"
  entrypoint = ["./tmp/main.exe"]
  delay = 1000
  exclude_dir = ["tmp", "logs", "node_modules", ".git", ".nuxt"]
  exclude_regex = ["_test\\.go"]

[log]
  time = true

[misc]
  clean_on_exit = true
