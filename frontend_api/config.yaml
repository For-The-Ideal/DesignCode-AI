mysql:
  dsn: "root:123456@tcp(127.0.0.1:3306)/design_code_ai?charset=utf8mb4&parseTime=True&loc=Local"
server:
  local: "http://localhost"
  port: ":8888"
  jwt_secret: "design_code_ai_secret_key"

# ═══════════════════════════════════════════════
#  AI 模型配置
#  启用 enabled: true 的模型会自动被优先级排序
#  priority 越小优先级越高
# ═══════════════════════════════════════════════
ai:
  logging:
    enabled: true
    directory: "logs"

  models:
    - provider: "deepseek"
      name: "DeepSeek V3"
      api_key: "your_deepseek_api_key"
      endpoint: "https://api.deepseek.com/v1/chat/completions"
      enabled: false
      max_retries: 2
      timeout: 60
      priority: 10

    - provider: "chatgpt"
      name: "ChatGPT 4o"
      api_key: "your_openai_api_key"
      endpoint: "https://api.openai.com/v1/chat/completions"
      enabled: false
      max_retries: 2
      timeout: 60
      priority: 20

    - provider: "codex"
      name: "OpenAI Codex"
      api_key: "your_openai_api_key"
      endpoint: "https://api.openai.com/v1/completions"
      enabled: false
      max_retries: 2
      timeout: 60
      priority: 30

    - provider: "gemini"
      name: "Gemini Pro"
      api_key: "your_gemini_api_key"
      endpoint: "https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent"
      enabled: false
      max_retries: 1
      timeout: 60
      priority: 25

    - provider: "claude"
      name: "Claude 3.5 Sonnet"
      api_key: "your_anthropic_api_key"
      endpoint: "https://api.anthropic.com/v1/messages"
      enabled: false
      max_retries: 2
      timeout: 60
      priority: 15

    - provider: "mock"
      name: "Local Mock"
      api_key: ""
      endpoint: ""
      enabled: true
      max_retries: 0
      timeout: 0
      priority: 99
